<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="smbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081a36" />
      <stop offset="100%" stop-color="#0d2b59" />
    </linearGradient>
    <linearGradient id="smbGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed57c" />
      <stop offset="100%" stop-color="#e5a83b" />
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#smbBg)" />
  <!-- Subtle Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#smbGold)" stroke-width="2" stroke-opacity="0.45" />
  <!-- SMB Typography -->
  <text
    x="32"
    y="39"
    text-anchor="middle"
    fill="url(#smbGold)"
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif"
    font-size="20"
    font-weight="900"
    letter-spacing="0.5px"
  >SMB</text>
</svg>
